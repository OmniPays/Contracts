name: Build contracts and release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Unique release name'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  repository-projects: write
  packages: write

defaults:
  run:
    working-directory: ./

jobs:
  release-soroswap-aggregator:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name }}
      release_description: 'OmniPays Aggregator contract release'
      relative_path: './contracts/aggregator'
      package: 'soroswap-aggregator'
      make_target: './Makefile'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-soroswap-aggregator-deployer:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name }}
      release_description: 'OmniPays deployer contract release'
      relative_path: './contracts/deployer'
      package: 'soroswap-aggregator-deployer'
      make_target: './Makefile'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-soroswap-adapter:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name }}
      release_description: 'OmniPays Soroswap adapter release'
      relative_path: './contracts/adapters/soroswap'
      package: 'soroswap-adapter'
      make_target: './Makefile'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-phoenix-adapter:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name }}
      release_description: 'OmniPays Phoenix adapter release'
      relative_path: './contracts/adapters/phoenix'
      package: 'phoenix-adapter'
      make_target: './Makefile'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-aqua-adapter:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name }}
      release_description: 'OmniPays Aqua adapter release'
      relative_path: './contracts/adapters/aqua'
      package: 'aqua-adapter'
      make_target: './Makefile'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-comet-adapter:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name }}
      release_description: 'OmniPays Comet adapter release'
      relative_path: './contracts/adapters/comet'
      package: 'comet-adapter'
      make_target: './Makefile'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
